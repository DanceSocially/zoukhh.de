body: >-
  Am Donnerstag habt ihr die Gelegenheit euch zu unser Trainingszeit zu verabreden. Das ist die
  Gelegenheit um gelerntes in entspannter Atmosphäre mit anderen zu üben und zu vertiefen.

  <h2>Kosten</h2>

  Um die Raumkosten zu decken, beträgt der Beitrag <strong>12 € pro Monat</strong>.<br/>
  Wenn Du nur ab und an kommen magst, kann auch pro Einheit 6 € bezahlt werden.
